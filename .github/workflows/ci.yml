name: CI

# Lint, tests, demos, and per-package conda builds all run in parallel.
# Most jobs share a pixi env cache; the build-conda matrix builds each
# .conda artifact independently and uploads it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Top-level verification jobs — independent, run in parallel.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: pixi run lint

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: pixi run test

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: pixi run test-rust

  demos:
    name: Demo CLIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: pixi run demo-simple
      - run: pixi run demo-full

  # ---------------------------------------------------------------------------
  # Per-package conda build — matrix runs in parallel, one job per package.
  # Mirrors the release-time pattern of large rust+pyo3 monorepos: each source
  # package's .conda artifact is built independently and uploaded so a release
  # workflow can publish them as a set.
  # ---------------------------------------------------------------------------

  build-conda:
    name: Build ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: fastthing,   path: python/fastthing }
          - { name: geocompute,  path: python/geocompute }
          - { name: slowthing,   path: libs/slowthing }
          - { name: geoanalysis, path: libs/geoanalysis }
          - { name: cli_simple,  path: apps/cli_simple }
          - { name: cli_full,    path: apps/cli_full }
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          run-install: false
      - name: Build ${{ matrix.package.name }} conda package
        run: pixi build --path ${{ matrix.package.path }} --output-dir conda-out
      - name: Upload .conda artifact
        uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.package.name }}
          path: conda-out/**/*.conda
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Aggregate gate — single required check that succeeds when every parallel
  # job above has succeeded. Branch protection should require only `ci-success`
  # rather than enumerating individual jobs.
  # ---------------------------------------------------------------------------

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, python-tests, rust-tests, demos, build-conda]
    steps:
      - name: Check upstream jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded."
