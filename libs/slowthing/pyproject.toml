[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "slowthing"
description = "Pure-Python wrapper around the fastthing PyO3 extension."
version = "0.1.0"
requires-python = ">=3.12"

[tool.pixi.package.build.backend]
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]
name = "pixi-build-python"
version = "0.4.*"

[tool.pixi.package.host-dependencies]
hatchling = { workspace = true }
python = { workspace = true }

[tool.pixi.package.run-dependencies]
python = { workspace = true }
fastthing = { path = "../../python/fastthing" }
