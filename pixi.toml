[workspace]
name = "pixi-monorepo-trial"
description = "End-to-end trial of a pixi-build monorepo: multi-crate rust groups -> PyO3 cdylibs -> pure-Python libs -> apps with divergent dep graphs."
authors = []
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

# Centralised versions inherited via `{ workspace = true }` in sub-package pyproject.toml files.
# Requires a pixi build from main (the v0.69 release does not yet ship this table).
[workspace.dependencies]
# Named external deps shared across sub-packages — inherited via `{ workspace = true }`.
# Source paths are NOT declared here; sub-packages reference them directly via `{ path = "..." }`.
python = "3.12.*"
maturin = ">=1.7,<2.0"
hatchling = "*"
typer = "*"

[dependencies]
# A single dep on each top-of-graph app pulls the whole tree:
#   cli_simple -> slowthing -> fastthing (PyO3) -> {fastthing-core, fastthing-stats}
#   cli_full   -> geoanalysis -> {fastthing, geocompute}
#                              -> {fastthing-core, fastthing-stats,
#                                  geocompute-core, geocompute-tiles}
cli_simple = { path = "apps/cli_simple" }
cli_full = { path = "apps/cli_full" }
# Workspace tooling not provided by any source package.
pytest = "*"
ruff = "*"

[tasks]
demo-simple = { cmd = "cli-simple summarise 1 2 3 4 5", description = "Run the math-only CLI (subcommand: summarise)." }
demo-full = { cmd = "cli-full tile-stats 0.5 0.5 1.0 1.0 5.0 5.0 --tile-max-x 2 --tile-max-y 2", description = "Run the geo+stats CLI." }
test = { cmd = "pytest libs apps --import-mode=importlib", description = "Run all Python tests." }
test-rust = { cmd = "cargo test --workspace", description = "Run all Rust tests." }
lint = { cmd = "ruff --version && ruff format --check --diff . && ruff check .", description = "Run ruff format check + lint." }
