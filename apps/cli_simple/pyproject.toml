[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "cli_simple"
description = "Math-only demo CLI: depends on slowthing -> fastthing PyO3 extension."
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
cli-simple = "cli_simple.__main__:app"

[tool.pixi.package.build.backend]
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]
name = "pixi-build-python"
version = "0.4.*"

[tool.pixi.package.host-dependencies]
hatchling = "*"
python = "3.12.*"

[tool.pixi.package.run-dependencies]
python = "3.12.*"
slowthing = { path = "../../libs/slowthing" }
typer = "*"
